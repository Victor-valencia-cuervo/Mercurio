name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        {
          echo "LASTFM_API_KEY=${LASTFM_API_KEY}"
          echo "LASTFM_SECRET=${LASTFM_SECRET}"
          if [ -n "${ANDROID_HOME}" ]; then
            echo "sdk.dir=${ANDROID_HOME}"
          fi
        } > local.properties

        if [ -n "${KEYSTORE_BASE64}" ]; then
          echo "${KEYSTORE_BASE64}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "Keystore configured: APK will be signed."
        else
          echo "KEYSTORE_BASE64 secret not set: building an unsigned release APK."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Release APK
      run: ./gradlew :app:assembleProdRelease :wearos:assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mercurio-prod-release
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mercurio-wear-prod-release
        path: wearos/build/outputs/apk/prod/release/*.apk
        if-no-files-found: warn

